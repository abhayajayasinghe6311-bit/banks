name: Study Garden headless browser regression
on:
  push:
    branches:
      - feature-enhanced-wrong-answer-teaching-banks1-10-20261021
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'scripts/browser_smoke.cjs'
      - '.github/workflows/browser-smoke.yml'
      - 'bank*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site locally and verify complete reader flows
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/study-garden-server.log 2>&1 &
          node scripts/browser_smoke.cjs
